<html>
<head>
<style>
:root { --line: #000; --soft: #888; }
body { margin: 0; padding: 0 3.8px; font-family: "Noto Sans SC"; font-size: 10.4px; line-height: 1.3; }
.head { display: flex; align-items: center; justify-content: space-between; margin-top: 2.8px; }
.brand { font-size: 16.1px; font-weight: bold; }
.bar { height: 10.4px; margin: 3.8px 0; background: linear-gradient(to right, #000, #fff); }
.card { position: relative; border: 0.9px dashed var(--line); border-radius: 6.6px; padding: 4.7px 5.7px; margin: 4.7px 0; }
.stamp { position: absolute; right: 4.7px; top: 3.8px; border: 1.4px solid #000; border-radius: 3.8px; padding: 0 3.8px; font-weight: bold; font-size: 9.4px; }
.badge { width: 42.5px; height: 42.5px; border-radius: 21.3px; background: radial-gradient(circle, #fff 0%, #000 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
.row { display: flex; align-items: center; gap: 4.7px; }
.grow { flex: 1; padding-left: 5.7px; }
ol.steps { counter-reset: step; list-style: none; padding: 0; margin: 2.8px 0; }
ol.steps li { counter-increment: step; }
ol.steps li::before { content: counter(step) ". "; font-weight: bold; }
.upper { text-transform: uppercase; }
.center { text-align: center; }
.wide-only { display: block; }
.narrow-only { display: none; }
@media (max-width: 50mm) { .wide-only { display: none; } .narrow-only { display: block; } .brand { font-size: 13.2px; } }
.photo { width: 56.7px; }
.soft { color: var(--soft); }
</style>
</head>
<body>
<div class="head">
<svg width="30" height="30" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="30" fill="none" stroke="#000" stroke-width="4"/><path d="M18 26h22v14a8 8 0 0 1-8 8h-6a8 8 0 0 1-8-8z" fill="#000"/><path d="M40 29h4a5 5 0 0 1 0 10h-4" fill="none" stroke="#000" stroke-width="3"/><path d="M24 12c-3 4 3 6 0 10M31 12c-3 4 3 6 0 10" fill="none" stroke="#000" stroke-width="2"/></svg>
<div class="brand">湖畔咖啡</div>
</div>
<div class="wide-only">80 mm 版式：只在宽度大于 400 点时显示</div>
<div class="narrow-only">58 mm 版式：只在窄纸上显示</div>
<div class="bar"></div>
<div class="card">
<div class="stamp">已支付</div>
<div><b>订单 #0042</b></div>
<div class="soft">var(--soft) 灰色文字会被抖动</div>
<div class="upper">upper-case text</div>
</div>
<div class="row">
<div class="badge">VIP</div>
<div class="grow">会员等级：金卡<br>积分 1,280</div>
</div>
<ol class="steps"><li>扫码关注公众号</li><li>输入订单号领取积分</li><li>下次消费抵扣</li></ol>
<div class="row"><img class="photo" src="logo.png"><div class="grow">PNG 图片经 Floyd-Steinberg 抖动</div></div>
<div class="center"><img style="width:25mm;height:25mm" src="qrcode:https%3A%2F%2Flakeside-cafe.example.com%2Fr%2F20261107-0042"></div>
<div class="center">扫码开发票</div>
<p>&nbsp;</p>
</body>
</html>
