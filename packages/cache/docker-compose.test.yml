# The backends of the store tests: docker compose -f docker-compose.test.yml up -d && npm run test:stores
services:
  redis:
    image: redis:7-alpine
    ports: ['16379:6379']
  memcached:
    image: memcached:1.6-alpine
    ports: ['11212:11211']
  mongo:
    image: mongo:7
    ports: ['27018:27017']
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
  mysql:
    image: mysql:8
    ports: ['13306:3306']
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cache
    # Over TCP: the temporary server of the initialization listens on the socket only
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-psecret', '--silent']
      interval: 2s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:16-alpine
    ports: ['15432:5432']
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cache
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres']
      interval: 2s
      timeout: 5s
      retries: 60
